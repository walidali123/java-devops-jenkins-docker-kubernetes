<text x="102" y="126" fill="#142a43" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700" text-anchor="start">How a release is configured to move</text>
<text x="102" y="175" fill="#536579" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start">A tagged artifact links the build to the Kubernetes deployment manifest.</text>
