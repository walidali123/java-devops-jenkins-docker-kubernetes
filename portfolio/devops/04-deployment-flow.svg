<text x="735" y="405" fill="#142a43" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start">Build versioned image</text>
<text x="735" y="445" fill="#536579" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start">Update project version + package JAR</text>
<text x="735" y="477" fill="#536579" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start">Docker tag includes Jenkins build number</text>
