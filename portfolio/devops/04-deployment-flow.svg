<text x="1355" y="405" fill="#142a43" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start">Publish to Amazon ECR</text>
<text x="1355" y="445" fill="#536579" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start">Registry login uses Jenkins credentials</text>
<text x="1355" y="477" fill="#536579" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start">docker push publishes the tagged image</text>
