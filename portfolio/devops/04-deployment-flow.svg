<text x="115" y="405" fill="#142a43" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start">Jenkins job starts</text>
<text x="115" y="445" fill="#536579" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start">Source checked out by job configuration</text>
<text x="115" y="477" fill="#536579" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start">Pipeline reads the Maven project</text>
