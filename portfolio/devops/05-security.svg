<text x="1012" y="644" fill="#142a43" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">Limitations of the checked-in deployment examples</text>
<text x="1012" y="675" fill="#536579" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">SSH commands disable host-key verification.</text>
<text x="1012" y="705" fill="#536579" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">Compose includes a literal database password; value omitted.</text>
<text x="1012" y="735" fill="#536579" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">Git credentials are interpolated into a remote URL.</text>
<text x="90" y="891" fill="#536579" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">Credential references show intended integration; secret provisioning and safe runtime handling need validation.</text>
